<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Teste de 20 perguntas que indica qual área de TI combina com você: software, dados, infraestrutura, segurança, produto e hardware. PT, EN, ES."><meta property="og:title" content="Teste de Áreas de TI"><meta property="og:description" content="Descubra qual área de TI combina com você."><title>Teste de Áreas de TI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: coluna única estreita, fundo preto e paleta rosa do README do Mapa de Carreiras em TI. */
:root{
  --bg:#0a0508; --surface:#150b11; --fg:#fbeef4; --muted:#c9a8b8; --line:#3a1c2b;
  --accent:#ff2a85; --accent2:#ff9eca; --accent-deep:#d81b60; --accent-fg:#14050c; --accent-soft:#2b0f1e;
  --term-bg:#000000; --term-fg:#ff9eca;
  --font-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(60rem 26rem at 50% -8%, rgba(255,42,133,.22), transparent 70%);
  background-repeat:no-repeat; color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.6;
  padding-block:32px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:24px}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
.mono{font-family:var(--font-mono)}
.label{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent2)}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.term{background:var(--term-bg); color:var(--term-fg); border:1px solid var(--accent-deep); box-shadow:0 0 28px rgba(255,42,133,.28); border-radius:10px; padding:16px 18px; font-family:var(--font-mono); font-size:13px; line-height:1.7; overflow-x:auto}
.term b{color:var(--accent); font-weight:700}
.term .dim{opacity:.7}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--accent); background:linear-gradient(135deg, var(--accent), var(--accent2)); color:var(--accent-fg); font-weight:600; padding:12px 22px; border-radius:8px; min-height:48px}
